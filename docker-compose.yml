services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/clinic.db
      STORAGE_DIR: /data/storage
      MODEL_PATH: /app/ml/artifacts/model.pt
      SCALER_PATH: /app/ml/artifacts/scaler.json
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
    volumes:
      - clinic_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 8

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  clinic_data:
